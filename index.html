  card('topics.html', 'topics', 'Темы', `${TOPICS.length - 1} topics, one per sheet: everything from a sheet in one place.`) +
  card('exercises.html', 'types', 'Упражнения', `${TYPES.length} kinds of exercise, plus reading, verbs and names.`) +
